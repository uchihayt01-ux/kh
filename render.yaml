# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/uchihayt01-ux/kh
services:
  - type: web
    name: kinetik-studio
    runtime: node
    plan: starter # persistent disks need a paid instance
    branch: claude/motion-graphics-portfolio-gkga4v
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # Render asks you for it during setup
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: studio-data
      mountPath: /var/data
      sizeGB: 10
